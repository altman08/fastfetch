name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # ---- 交叉编译 (BCM 工具链，兼容老内核/老 glibc) ----
  build-cross:
    name: build-${{ matrix.platform.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: arm
            script: .github/build/build_merlin.sh
            toolchain_dir: crosstools-arm-gcc-5.5-linux-4.1-glibc-2.26-binutils-2.28.1
          - name: aarch64
            script: .github/build/build_cat.sh
            toolchain_dir: crosstools-aarch64-gcc-5.5-linux-4.1-glibc-2.26-binutils-2.28.1
    env:
      TOOLCHAINS_REPO: https://github.com/SWRT-dev/bcmhnd-toolchains.git
    steps:
      - name: Install 32-bit runtime libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make \
            libc6:i386 libstdc++6:i386 zlib1g:i386 \
            libmpc3:i386 libmpfr6:i386 libgmp10:i386
          wget -q https://security.ubuntu.com/ubuntu/pool/universe/i/isl-0.18/libisl15_0.18-4_i386.deb
          sudo dpkg -i libisl15_0.18-4_i386.deb || sudo apt-get install -f -y
          rm -f libisl15_0.18-4_i386.deb
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo mkdir -p /opt/toolchains
          sudo chown "$(id -u):$(id -g)" /opt/toolchains
          git clone --depth 1 --filter=blob:none --sparse "$TOOLCHAINS_REPO" /opt/toolchains
          cd /opt/toolchains
          git sparse-checkout set "${{ matrix.platform.toolchain_dir }}"
      - name: Build
        env:
          TOOLCHAIN: /opt/toolchains/${{ matrix.platform.toolchain_dir }}
        run: |
          bash "${{ matrix.platform.script }}"
          cp build/fastfetch build/fastfetch-${{ matrix.platform.name }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-${{ matrix.platform.name }}
          path: build/fastfetch-${{ matrix.platform.name }}

  # ---- 发布 Release ----
  release-tag:
    runs-on: ubuntu-latest
    needs: [build-cross]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: fastfetch-*
          path: build/arch
          merge-multiple: true
      - name: Create Release Archives
        run: |
          cd build/arch
          for f in fastfetch-*; do
            tar czf "${f}.tar.gz" "$f"
          done
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/arch/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
